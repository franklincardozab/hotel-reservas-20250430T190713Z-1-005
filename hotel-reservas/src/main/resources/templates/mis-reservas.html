<tr th:each="reserva : ${reservas}">
    <td th:text="${reserva.hotel.nombre}"></td>
    <td th:text="${reserva.fechaEntrada}"></td>
    <td th:text="${reserva.fechaSalida}"></td>
    <td th:text="${reserva.precioTotal}"></td>
    <td>
        <a th:href="@{/pago(descripcion=${reserva.hotel.nombre}, precio=${reserva.precioTotal})}">
            <button>Pagar</button>
        </a>
    </td>
</tr>
