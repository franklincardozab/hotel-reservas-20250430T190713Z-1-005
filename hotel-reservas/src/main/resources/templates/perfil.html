<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Mi Perfil</h2>

    <div class="card shadow p-4">
        <form method="post" th:action="@{/perfil}">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" th:value="${usuario.nombre}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" th:value="${usuario.email}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" th:value="${usuario.telefono}">
            </div>
            <button type="submit" class="btn btn-primary w-100">Actualizar Perfil</button>
        </form>

        <div th:if="${param.success}" class="alert alert-success mt-3">
            ¡Perfil actualizado con éxito!
        </div>
    </div>
</div>

</body>
</html>
