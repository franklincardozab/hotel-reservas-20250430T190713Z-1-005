<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Mis Reservas</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Hotel</th>
                <th>Fecha de Entrada</th>
                <th>Fecha de Salida</th>
                <th>Monto</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.hotel.nombre}"></td>
                <td th:text="${reserva.fechaEntrada}"></td>
                <td th:text="${reserva.fechaSalida}"></td>
                <td th:text="${reserva.monto}"></td>
                <td>
                    <a th:href="@{/pago/checkout/{id}(id=${reserva.id})}" class="btn btn-primary btn-sm">Pagar</a>
                    <a th:href="@{/reservas/cancelar/{id}(id=${reserva.id})}" class="btn btn-danger btn-sm">Cancelar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
